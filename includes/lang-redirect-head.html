<script id="gm-lang-redirect">(function(){
  var SUPPORTED = ["en","de","es","fr","it","nl","pt"];
  var path = window.location.pathname;
  var m = path.match(/^\/learn-hub\/(de|es|fr|it|nl|pt)(\/|$)/);
  var current = m ? m[1] : "en";
  var v = ("; " + document.cookie).split("; gm_lang=");
  var cookieLang = v.length === 2 ? decodeURIComponent(v.pop().split(";").shift()) : null;

  // URL is the source of truth on direct navigation. If the URL has an
  // explicit language prefix, trust it and update the cookie to match.
  // Only redirect when the URL is the default (English, no prefix) AND
  // the cookie indicates a non-default language preference.
  if (current !== "en") {
    if (cookieLang !== current) {
      var d = new Date(); d.setTime(d.getTime() + 365*24*60*60*1000);
      var parts = location.hostname.split('.');
      var domain = parts.length >= 2 ? "; domain=." + parts.slice(-2).join('.') : "";
      document.cookie = "gm_lang=" + current + "; expires=" + d.toUTCString() + "; path=/; samesite=lax" + domain;
    }
    return;
  }

  // current === "en" (no language prefix in URL). SERVE ENGLISH. Do not redirect.
  //
  // JOHN'S RULE, 2026-09-09: "We dont want real english users goign to a foreign page
  // EVER" / "Yes serve english when in doubt".
  //
  // This used to hard-replace the location with whatever language the gm_lang cookie
  // held. One click on a German link anywhere on the site set that cookie, and from then
  // on every English Learn Hub URL - a Google result, a link in a mail - bounced the
  // visitor to the German page. Because it replaced rather than assigned, the Back
  // button could not get them out of it either.
  //
  // The URL is the language. A localized visitor reaches their hub through the localized
  // nav, which now links /learn-hub/{lang}/ directly, so nothing needs the cookie to
  // route it. The cookie is left alone here on purpose: the WordPress side resets it on
  // a real page load, and writing it from a page that may be a speculative prerender
  // would clobber a genuine member's stored language.
})();</script>
